name: Check workspaces

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked development workspaces
        if: matrix.node == 24
        run: npm ci
      - name: Install lean daemon runtime
        if: matrix.node == 20
        run: npm run install:daemon
      - name: Test protocol, daemon and desktop boundary
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check client TypeScript
        if: matrix.node == 24
        run: npm run typecheck
      - name: Check project formatting
        if: matrix.node == 24
        run: npm run format:check
      - name: Verify native JavaScript bundle
        if: matrix.node == 24
        run: npm run bundle --workspace @hypir/android -- --max-workers 2
      - name: Package standalone Linux client
        if: matrix.node == 24
        run: npm run build:desktop
      - name: Verify lean daemon runtime
        if: matrix.node == 24
        run: npm run install:daemon && npm test
