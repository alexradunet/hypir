<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hypir — Presentation moved</title>
    <script>
      const destination = new URL('./docs/', window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=./docs/" /></noscript>
  </head>
  <body>
    <main>
      <h1>The Hypir presentation lives in docs.</h1>
      <p><a href="./docs/">Continue to Hypir</a></p>
    </main>
  </body>
</html>
